name: Validate and package Network Watch

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the packaged artifacts as a GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, renderer, and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test store and MCP contracts
        run: pnpm run test:mcp

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Validate Docker image
        run: docker build --file infra/docker/Dockerfile --tag network-watch:ci .

  package:
    name: Package for ${{ matrix.platform }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: network-watch-linux
            build_args: --linux AppImage
          - os: windows-latest
            platform: windows
            artifact_name: network-watch-windows
            build_args: --win nsis
          - os: macos-latest
            platform: macos
            artifact_name: network-watch-macos
            build_args: --mac dmg zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build Electron package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find dist -maxdepth 1 -type f \( \
            -name "*.AppImage" -o \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.blockmap" \
          \) -print -exec cp {} release-artifacts/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Choose release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ) ]]; then
            package_version="$(node -p "require('./package.json').version")"
            echo "tag=v${package_version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Network Watch ${{ steps.tag.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
